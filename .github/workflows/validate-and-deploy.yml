name: Validate Catalogue & Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Validate TSVs & Render Quarto Site
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies (jsonlite)
        run: Rscript -e 'if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite")'

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto + Observable JS website (runs pre_render.R validation & JSON build)
        run: quarto render site

      - name: Check whether GitHub Pages is enabled on this repository
        id: check_pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is enabled; uploading Pages artifact."
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "GitHub Pages is not enabled (e.g. private repo without GitHub Pro/Enterprise); skipping Pages deploy."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload Pages artifact (when Pages is enabled)
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
